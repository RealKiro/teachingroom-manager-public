services:
  teachingroom:
    # 默认拉取官方预构建镜像；在 .env 中配置 TEACHINGROOM_IMAGE 可换成自己的镜像
    image: ${TEACHINGROOM_IMAGE:-ghcr.io/realkiro/teachingroom-manager-public:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: teachingroom-manager
    init: true
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - SESSION_SECRET=${SESSION_SECRET:-}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-}
      - DB_PATH=/app/data/teachingroom.sqlite
      - AUTO_BACKUP_KEEP=200
    volumes:
      # 运行数据都在本目录（与 docker-compose.yml 同级）
      - ./data:/app/data
      - ./backups:/app/backups
      - ./uploads:/app/uploads
      - ./exports:/app/exports
    restart: unless-stopped
