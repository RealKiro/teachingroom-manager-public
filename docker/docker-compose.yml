services:
  teachingroom:
    # 默认拉取仓库自带的 GHCR 镜像；Fork 用户在 .env 中配置
    # TEACHINGROOM_IMAGE=ghcr.io/<你的用户名>/teachingroom-manager-public:latest 即可换成自己的镜像
    image: ${TEACHINGROOM_IMAGE:-ghcr.io/realkiro/teachingroom-manager-public:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: teachingroom-manager
    init: true
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - SESSION_SECRET=${SESSION_SECRET:-}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-}
      - DB_PATH=/app/data/teachingroom.sqlite
      - AUTO_BACKUP_KEEP=200
    volumes:
      - ../data:/app/data
      - ../backups:/app/backups
      - ../uploads:/app/uploads
      - ../exports:/app/exports
      - ../初始化数据表格（虚拟）.xlsx:/app/初始化数据表格（虚拟）.xlsx:ro
    restart: unless-stopped
