name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  workers-smoke:
    name: Workers smoke test (wrangler dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start wrangler dev
        run: |
          npx --yes wrangler@latest dev --port 8787 \
            --var SESSION_SECRET:ci-workers-smoke-secret \
            --var INITIAL_ADMIN_PASSWORD:ci-workers-password \
            > wrangler-dev.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null 2>&1; then
              echo "worker ready"
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "::error::worker did not become ready"
              cat wrangler-dev.log
              exit 1
            fi
            sleep 2
          done

      - name: Smoke test API
        run: |
          set -e
          check() {
            local desc="$1"; shift
            local pattern="$1"; shift
            local body
            if ! body=$(curl -fsS "$@" 2>&1); then
              echo "::error::$desc request failed"
              echo "$body" | head -40
              tail -60 wrangler-dev.log
              exit 1
            fi
            echo "$desc => $body" | head -c 400; echo
            echo "$body" | grep -q "$pattern" || {
              echo "::error::$desc response missing pattern: $pattern"
              tail -60 wrangler-dev.log
              exit 1
            }
          }
          check "health" '"ok":true' http://127.0.0.1:8787/api/health
          check "login" '"username":"admin"' -c /tmp/cookies -X POST http://127.0.0.1:8787/api/login \
            -H 'content-type: application/json' \
            -d '{"username":"admin","password":"ci-workers-password"}'
          check "fields" 'building' -b /tmp/cookies http://127.0.0.1:8787/api/fields
          check "create-classroom" 'X101' -b /tmp/cookies -X POST http://127.0.0.1:8787/api/classrooms \
            -H 'content-type: application/json' \
            -d '{"values":{"building":"X栋","room":"X101"},"clientRequestId":"ci-workers-classroom-01"}'
          check "create-backup" 'teachingroom-' -b /tmp/cookies -X POST http://127.0.0.1:8787/api/backups
          check "list-backups" 'manual' -b /tmp/cookies http://127.0.0.1:8787/api/backups
          echo "Workers smoke test passed"

      - name: Print wrangler logs on failure
        if: failure()
        run: cat wrangler-dev.log
